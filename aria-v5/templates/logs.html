<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#3fb950">
<link rel="manifest" href="/manifest.json">
<title>ARIA · Logs & DB Browser</title>
<link rel="stylesheet" href="/static/aria.css">
<style>
.logs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;height:calc(100vh - 46px);margin-top:46px;background:var(--bg4);overflow:hidden}
.log-panel,.db-panel{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.panel-hd{padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--bg4);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.panel-title{font-size:10px;font-weight:700;color:var(--t1);letter-spacing:.5px}
.log-body{flex:1;overflow-y:auto;font-family:var(--font);font-size:11px;padding:4px 0}
.log-line{padding:2px 10px;border-bottom:1px solid rgba(255,255,255,.02);display:flex;gap:8px;align-items:baseline}
.log-line:hover{background:var(--bg2)}
.log-ts{color:var(--t3);font-size:9px;flex-shrink:0;white-space:nowrap}
.log-lvl{font-size:9px;font-weight:700;flex-shrink:0;width:36px}
.log-name{color:var(--t3);font-size:9px;flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-msg{color:var(--t1);flex:1;word-break:break-all}
.lvl-INFO{color:var(--blue)}.lvl-DEBUG{color:var(--t3)}.lvl-WARNING{color:var(--yellow)}.lvl-ERROR{color:var(--red)}.lvl-CRITICAL{color:var(--red);font-weight:bold}
/* DB Browser */
.db-sidebar{width:160px;background:var(--bg2);border-right:1px solid var(--bg4);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.db-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.db-item{padding:6px 10px;font-size:11px;cursor:pointer;border-bottom:1px solid var(--bg3);color:var(--t2);transition:all .1s;display:flex;justify-content:space-between;align-items:center}
.db-item:hover{background:var(--bg3);color:var(--t1)}
.db-item.sel{background:var(--bg3);color:var(--blue);border-left:2px solid var(--blue)}
.table-item{padding:5px 12px;font-size:11px;cursor:pointer;border-bottom:1px solid var(--bg3);color:var(--t2);transition:all .1s}
.table-item:hover{background:var(--bg3);color:var(--t1)}
.table-item.sel{color:var(--green)}
.db-content{flex:1;overflow:auto}
.db-table-wrap{overflow:auto;flex:1}
.sql-bar{display:flex;gap:6px;padding:7px 10px;background:var(--bg2);border-top:1px solid var(--bg4);flex-shrink:0}
.sql-bar input{flex:1;background:var(--bg3);border:1px solid var(--bg4);color:var(--t1);padding:5px 9px;font-family:var(--font);font-size:11px;border-radius:var(--r);outline:none}
.sql-bar input:focus{border-color:var(--blue)}
.count-badge{font-size:9px;background:var(--bg3);color:var(--t2);padding:1px 6px;border-radius:8px}
@media(max-width:768px){
  .logs-grid{grid-template-columns:1fr;grid-template-rows:50vh 50vh}
  .db-sidebar{width:130px}
}
</style>
</head>
<body>
<div class="aria-topbar">
  <button class="aria-hamburger" onclick="toggleMobileNav()">☰</button>
  <span class="aria-logo">ARIA</span>
  <span class="aria-sep">·</span>
  <span class="aria-page">Logs & DB</span>
  <nav class="aria-nav">
    <a href="/">Terminal</a><a href="/status">Status</a>
    <a href="/logs" class="active">Logs</a><a href="/scanner">Scanner</a>
    <a href="/vault">Vault</a><a href="/settings">Settings</a>
  </nav>
  <div class="aria-topbar-right">
    <div class="aria-status-dot green" id="sys-dot"></div>
  </div>
</div>
<nav class="aria-mobile-nav" id="mobile-nav">
  <a href="/">Terminal</a><a href="/status">Status</a>
  <a href="/logs" class="active">Logs & DB</a>
  <a href="/scanner">Scanner</a><a href="/vault">Vault</a><a href="/settings">Settings</a>
</nav>

<div class="logs-grid">
  <!-- LOG VIEWER -->
  <div class="log-panel">
    <div class="panel-hd">
      <span class="panel-title">📋 Live Logs</span>
      <div class="live-dot"></div>
      <select id="lvl-filter" class="aria-select" style="padding:3px 7px;font-size:10px" onchange="filterLevel(this.value)">
        <option value="">All levels</option>
        <option value="DEBUG">DEBUG</option>
        <option value="INFO">INFO</option>
        <option value="WARNING">WARNING</option>
        <option value="ERROR">ERROR</option>
      </select>
      <input id="log-search" class="aria-input" style="max-width:120px;padding:3px 7px;font-size:10px" placeholder="Filter..." oninput="renderLogs()">
      <button class="aria-btn" style="padding:3px 8px;font-size:10px" onclick="clearLogs()">Clear</button>
      <span class="count-badge" id="log-count">0</span>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>

  <!-- DB BROWSER -->
  <div class="db-panel">
    <div class="panel-hd">
      <span class="panel-title">🗄 Database Browser</span>
      <span class="count-badge" id="db-row-count">--</span>
    </div>
    <div style="display:flex;flex:1;overflow:hidden">
      <!-- Sidebar: DBs + Tables -->
      <div class="db-sidebar">
        <div style="padding:5px 8px;font-size:8px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--bg4)">Databases</div>
        <div id="db-list" style="overflow-y:auto;flex:1"></div>
        <div style="padding:5px 8px;font-size:8px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--bg4);border-top:1px solid var(--bg4)">Tables</div>
        <div id="table-list" style="overflow-y:auto;flex:1"></div>
      </div>
      <!-- Main: Table data -->
      <div class="db-main">
        <div class="db-table-wrap" id="db-content">
          <div style="padding:16px;color:var(--t3);font-size:11px">Select a database and table</div>
        </div>
        <div class="sql-bar">
          <input id="sql-input" placeholder="SELECT * FROM table LIMIT 50" onkeydown="if(event.key==='Enter')runSQL()">
          <button class="aria-btn blue" style="padding:5px 10px;font-size:10px" onclick="runSQL()">Run</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/aria.js"></script>
<script>
let _allLogs=[], _curDB='', _curTable='', _autoScroll=true;

// ── LOGS ──────────────────────────────────────────────────────────────────
let _sse=null;
function startLogs(){
  if(_sse)_sse.close();
  _sse=new EventSource('/api/logs/stream');
  _sse.onmessage=e=>{
    try{const d=JSON.parse(e.data);_allLogs.push(d);if(_allLogs.length>2000)_allLogs.shift();renderLogs();}catch{}
  };
  _sse.onerror=()=>setTimeout(startLogs,3000);
}
function renderLogs(){
  const lvl=document.getElementById('lvl-filter').value;
  const q=(document.getElementById('log-search').value||'').toLowerCase();
  let logs=_allLogs;
  if(lvl)logs=logs.filter(l=>l.level===lvl);
  if(q)logs=logs.filter(l=>l.msg.toLowerCase().includes(q)||l.name?.toLowerCase().includes(q));
  document.getElementById('log-count').textContent=logs.length;
  const body=document.getElementById('log-body');
  const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<40;
  body.innerHTML=logs.slice(-500).map(l=>{
    const t=new Date(l.ts*1000).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="log-line">
      <span class="log-ts">${t}</span>
      <span class="log-lvl lvl-${l.level}">${l.level?.slice(0,4)}</span>
      <span class="log-name">${l.name||''}</span>
      <span class="log-msg">${(l.msg||'').replace(/</g,'&lt;')}</span>
    </div>`;
  }).join('');
  if(atBottom||_autoScroll)body.scrollTop=body.scrollHeight;
}
function filterLevel(v){ renderLogs(); }
function clearLogs(){ _allLogs=[];renderLogs(); }

// ── DB BROWSER ────────────────────────────────────────────────────────────
async function loadDBs(){
  const dbs=await api('GET','/api/db/list');
  document.getElementById('db-list').innerHTML=dbs.map(d=>
    `<div class="db-item${d.name===_curDB?' sel':''}" onclick="selectDB('${d.name}')">
      <span>${d.name.replace('.db','')}</span>
      <span style="font-size:9px;color:var(--t3)">${d.size_kb}K</span>
    </div>`).join('');
}
async function selectDB(name){
  _curDB=name;_curTable='';
  document.getElementById('sql-input').value=`SELECT * FROM `;
  loadDBs();
  const r=await api('GET',`/api/db/tables?db=${name}`);
  document.getElementById('table-list').innerHTML=(r.tables||[]).map(t=>
    `<div class="table-item" onclick="selectTable('${t}')">${t}</div>`).join('');
  document.getElementById('db-content').innerHTML='<div style="padding:12px;color:var(--t3);font-size:11px">Select a table</div>';
}
async function selectTable(name){
  _curTable=name;
  document.querySelectorAll('.table-item').forEach(el=>{
    el.classList.toggle('sel',el.textContent===name);
  });
  document.getElementById('sql-input').value=`SELECT * FROM ${name} LIMIT 100`;
  await loadTable(name,0);
}
async function loadTable(name,offset=0){
  const r=await api('GET',`/api/db/table?db=${_curDB}&table=${name}&limit=100&offset=${offset}`);
  if(r.error){document.getElementById('db-content').innerHTML=`<div style="padding:12px;color:var(--red);font-size:11px">${r.error}</div>`;return;}
  document.getElementById('db-row-count').textContent=`${r.rows.length}/${r.total} rows`;
  renderTable(r.cols,r.rows,r.total,offset);
}
async function runSQL(){
  const sql=document.getElementById('sql-input').value.trim();
  if(!sql||!_curDB)return;
  const r=await api('POST','/api/db/query',{db:_curDB,sql});
  if(r.error){toast(r.error,'err');return;}
  document.getElementById('db-row-count').textContent=r.count+' rows';
  renderTable(r.cols,r.rows,r.count,0);
}
function renderTable(cols,rows,total,offset){
  if(!rows.length){document.getElementById('db-content').innerHTML='<div style="padding:12px;color:var(--t3);font-size:11px">No data</div>';return;}
  const headers=cols.map(c=>`<th>${c}</th>`).join('');
  const body_rows=rows.map(row=>`<tr>${row.map(v=>`<td>${v===null?'<span style="color:var(--t3)">null</span>':String(v).slice(0,120).replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('');
  document.getElementById('db-content').innerHTML=`<table class="aria-tbl" style="min-width:400px"><thead><tr>${headers}</tr></thead><tbody>${body_rows}</tbody></table>`;
}

onSysData(d=>{document.getElementById('sys-dot').className='aria-status-dot green';});
startLogs();loadDBs();
</script>
</body>
</html>
