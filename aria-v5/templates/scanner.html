<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#3fb950">
<link rel="manifest" href="/manifest.json">
<title>ARIA · Network Scanner</title>
<link rel="stylesheet" href="/static/aria.css">
<style>
.scan-wrap{margin-top:46px;height:calc(100vh - 46px);display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;background:var(--bg4);gap:1px}
.scan-side{background:var(--bg);overflow-y:auto}
.scan-main{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.scan-sec{padding:5px 12px 2px;font-size:8px;font-weight:700;color:var(--t3);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--bg4);margin-top:6px}
.scan-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:none;background:none;color:var(--t2);cursor:pointer;width:100%;text-align:left;font-family:var(--font);font-size:12px;border-bottom:1px solid var(--bg3);transition:all .12s}
.scan-btn:hover{background:var(--bg3);color:var(--t1)}
.scan-btn.act{color:var(--green);background:var(--bg3)}
.scan-input-row{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bg4)}
.scan-input-row input{flex:1;background:var(--bg3);border:1px solid var(--bg4);color:var(--t1);padding:6px 9px;font-family:var(--font);font-size:11px;border-radius:var(--r);outline:none}
.scan-input-row input:focus{border-color:var(--blue)}
.result-hd{padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--bg4);font-size:11px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px;flex-shrink:0}
.result-body{flex:1;overflow-y:auto;padding:10px 14px}
.host-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}
.host-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.host-ip{font-size:13px;font-weight:700;color:var(--blue)}
.host-nm{font-size:10px;color:var(--t2)}
.port-row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--bg3);font-size:11px}
.port-num{color:var(--blue);font-weight:700;min-width:48px}
.port-svc{color:var(--t1);flex:1}
.port-banner{color:var(--t3);font-size:10px;flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk-item{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11px;border-bottom:1px solid var(--bg3)}
.score-ring{width:60px;height:60px;flex-shrink:0}
.grade-big{font-size:28px;font-weight:700}
.wifi-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bg3);font-size:11px}
.progress-bar-wrap{background:var(--bg3);border-radius:var(--r);height:5px;margin:6px 0;overflow:hidden}
.progress-bar{height:100%;background:var(--blue);border-radius:var(--r);transition:width .3s}
@media(max-width:768px){
  .scan-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .scan-side{max-height:220px}
}
</style>
</head>
<body>
<div class="aria-topbar">
  <button class="aria-hamburger" onclick="toggleMobileNav()">☰</button>
  <span class="aria-logo">ARIA</span><span class="aria-sep">·</span><span class="aria-page">Scanner</span>
  <nav class="aria-nav">
    <a href="/">Terminal</a><a href="/status">Status</a>
    <a href="/logs">Logs</a><a href="/scanner" class="active">Scanner</a>
    <a href="/vault">Vault</a><a href="/settings">Settings</a>
  </nav>
  <div class="aria-topbar-right"><div class="aria-status-dot" id="sys-dot" style="background:var(--yellow)"></div></div>
</div>
<nav class="aria-mobile-nav" id="mobile-nav">
  <a href="/">Terminal</a><a href="/status">Status</a>
  <a href="/scanner" class="active">Scanner</a><a href="/vault">Vault</a><a href="/settings">Settings</a>
</nav>

<div class="scan-wrap">
  <!-- Sidebar -->
  <div class="scan-side">
    <div class="scan-sec">Scan Type</div>
    <button class="scan-btn act" onclick="setMode('audit',this)">🔍 Quick Audit</button>
    <button class="scan-btn" onclick="setMode('host',this)">🖥 Port Scan</button>
    <button class="scan-btn" onclick="setMode('discover',this)">📡 LAN Discovery</button>
    <button class="scan-btn" onclick="setMode('wifi',this)">📶 WiFi Networks</button>
    <button class="scan-btn" onclick="setMode('nmap',this)">🛡 Nmap Scan</button>

    <div class="scan-sec">Target</div>
    <div class="scan-input-row">
      <input id="scan-target" value="127.0.0.1" placeholder="IP / subnet / hostname">
    </div>
    <div class="scan-input-row" id="nmap-flags-row" style="display:none">
      <input id="nmap-flags" value="-sV --open -T4" placeholder="nmap flags">
    </div>
    <div style="padding:6px 12px">
      <button class="aria-btn solid-green w-full" onclick="runScan()">▶ Run Scan</button>
    </div>

    <div class="scan-sec" style="margin-top:8px">Last Scan</div>
    <div id="scan-summary" style="padding:8px 12px;font-size:11px;color:var(--t2)">No scan yet</div>
  </div>

  <!-- Main result -->
  <div class="scan-main">
    <div class="result-hd">
      <span id="result-title">Select a scan type and click Run</span>
      <div id="scan-progress" style="display:none;flex:1;max-width:200px">
        <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
      </div>
    </div>
    <div class="result-body" id="result-body">
      <div style="color:var(--t3);font-size:11px;padding:8px 0">Results will appear here</div>
    </div>
  </div>
</div>

<script src="/static/aria.js"></script>
<script>
let _mode='audit';
function setMode(m,btn){
  _mode=m;
  document.querySelectorAll('.scan-btn').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  document.getElementById('nmap-flags-row').style.display=m==='nmap'?'flex':'none';
  const hints={
    audit:'Target: IP to audit (default: localhost)',
    host:'Target: IP or hostname to port-scan',
    discover:'Target: Subnet (e.g. 192.168.1.0/24) or leave blank for auto-detect',
    wifi:'No target needed — scans nearby WiFi',
    nmap:'Target: IP, range, or hostname + nmap flags'
  };
  document.getElementById('result-title').textContent=hints[m]||m;
}

async function runScan(){
  const target=document.getElementById('scan-target').value.trim()||'127.0.0.1';
  const body=document.getElementById('result-body');
  document.getElementById('result-title').textContent='Scanning...';
  body.innerHTML='<div style="color:var(--t2);font-size:11px;padding:8px 0">⏳ Scanning...</div>';
  document.getElementById('prog-bar').style.width='30%';
  document.getElementById('scan-progress').style.display='block';

  let result;
  if(_mode==='audit'){
    result=await api('POST','/api/scanner/audit',{host:target});
    renderAudit(result);
  } else if(_mode==='host'){
    result=await api('POST','/api/scanner/host',{host:target});
    renderHostScan(result);
  } else if(_mode==='discover'){
    await runDiscover(target);
    return;
  } else if(_mode==='wifi'){
    result=await api('GET','/api/scanner/wifi');
    renderWifi(result);
  } else if(_mode==='nmap'){
    const flags=document.getElementById('nmap-flags').value;
    result=await api('POST','/api/scanner/nmap',{target,flags});
    renderNmap(result);
  }
  document.getElementById('prog-bar').style.width='100%';
  setTimeout(()=>document.getElementById('scan-progress').style.display='none',1000);
  document.getElementById('scan-summary').textContent=`Last: ${_mode} on ${target} at ${new Date().toLocaleTimeString()}`;
}

function renderAudit(r){
  if(r.error){document.getElementById('result-body').innerHTML=`<div style="color:var(--red);font-size:11px">${r.error}</div>`;return;}
  const colGrade=r.grade==='A'?'var(--green)':r.grade==='B'?'var(--blue)':r.grade==='C'?'var(--yellow)':'var(--red)';
  document.getElementById('result-title').textContent=`Security Audit: ${r.host} — Grade ${r.grade}`;
  document.getElementById('result-body').innerHTML=`
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--bg4)">
      <div style="text-align:center">
        <div class="grade-big" style="color:${colGrade}">${r.grade}</div>
        <div style="font-size:9px;color:var(--t2)">Grade</div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:700;color:${colGrade}">${r.security_score}/100</div>
        <div style="font-size:10px;color:var(--t2)">Security Score</div>
        <div style="font-size:11px;color:var(--t1);margin-top:4px">${r.recommendation||''}</div>
      </div>
    </div>
    ${(r.issues||[]).map(i=>`<div class="risk-item">
      <div class="pill pill-${i.sev==='CRITICAL'?'red':i.sev==='HIGH'?'red':'yellow'}">${i.sev}</div>
      <span style="color:var(--t1)">Port ${i.port}: ${i.msg}</span>
    </div>`).join('')}
    ${r.open_ports?.length?`<div style="margin-top:12px;font-size:10px;font-weight:700;color:var(--t2);letter-spacing:1px">OPEN PORTS (${r.open_ports.length})</div>`:''}
    ${(r.open_ports||[]).map(p=>`<div class="port-row">
      <span class="port-num">${p.port}</span>
      <span class="port-svc">${p.service}</span>
      <span class="port-banner">${p.banner||''}</span>
    </div>`).join('')}`;
}

function renderHostScan(r){
  if(!r.alive){document.getElementById('result-body').innerHTML=`<div style="color:var(--t2);font-size:11px;padding:8px 0">Host ${r.host} not reachable</div>`;return;}
  document.getElementById('result-title').textContent=`Port Scan: ${r.host} — ${r.open_ports?.length||0} open ports`;
  document.getElementById('result-body').innerHTML=`
    <div class="host-card">
      <div class="host-hd">
        <div class="pill pill-green">● ALIVE</div>
        <span class="host-ip">${r.host}</span>
        ${r.hostname?`<span class="host-nm">${r.hostname}</span>`:''}
      </div>
      ${(r.open_ports||[]).map(p=>`<div class="port-row">
        <span class="port-num">${p.port}</span>
        <span class="port-svc">${p.service}</span>
        <span class="port-banner">${p.banner||''}</span>
      </div>`).join('')}
      ${!(r.open_ports?.length)?'<div style="color:var(--t3);font-size:11px;padding:4px 0">No open ports found</div>':''}
    </div>`;
}

async function runDiscover(subnet){
  document.getElementById('result-title').textContent='Discovering LAN hosts...';
  document.getElementById('result-body').innerHTML='';
  const es=new EventSource(`/api/scanner/discover`);
  // Actually use fetch SSE
  const res=await fetch('/api/scanner/discover',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({subnet:subnet||null})});
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
  let hosts=[];
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n\n'))>=0){
      const raw=buf.slice(0,idx).replace('data: ','');buf=buf.slice(idx+2);
      try{
        const ev=JSON.parse(raw);
        if(ev.type==='host'){
          hosts.push(ev.host);
          document.getElementById('prog-bar').style.width=Math.min(90,hosts.length*5)+'%';
        }
        if(ev.type==='done'){
          document.getElementById('result-title').textContent=`LAN Discovery: ${ev.total} hosts found`;
        }
      }catch{}
    }
  }
  document.getElementById('result-body').innerHTML=hosts.map(h=>`
    <div class="port-row">
      <span class="port-num" style="color:var(--green)">●</span>
      <span class="port-svc">${h.ip}</span>
      <span class="port-banner">${h.hostname||''}</span>
      <button onclick="scanThisHost('${h.ip}')" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:10px;font-family:inherit">Scan →</button>
    </div>`).join('');
  document.getElementById('prog-bar').style.width='100%';
  setTimeout(()=>document.getElementById('scan-progress').style.display='none',1000);
}

function scanThisHost(ip){
  document.getElementById('scan-target').value=ip;
  setMode('host',document.querySelector('.scan-btn:nth-child(2)'));
  runScan();
}

function renderWifi(r){
  document.getElementById('result-title').textContent=`WiFi Networks: ${r.length} found`;
  document.getElementById('result-body').innerHTML=r.map(w=>`<div class="wifi-row">
    <span style="color:var(--t1);font-weight:600">${w.ssid||'(hidden)'}</span>
    <span style="color:var(--t2)">${w.security||'Open'}</span>
    <span style="color:var(--blue)">${w.signal||'?'} ${w.freq?'· '+w.freq:''}</span>
  </div>`).join('')||'<div style="color:var(--t3);font-size:11px">No networks found or WiFi not available</div>';
}

function renderNmap(r){
  document.getElementById('result-title').textContent=r.ok?'Nmap Scan Complete':'Nmap Error';
  const pre=document.createElement('pre');
  pre.style.cssText='font-size:11px;color:var(--t1);white-space:pre-wrap;word-break:break-all;padding:4px 0';
  pre.textContent=r.output||r.error||'No output';
  document.getElementById('result-body').innerHTML='';
  document.getElementById('result-body').appendChild(pre);
}

onSysData(d=>{document.getElementById('sys-dot').className='aria-status-dot green';});
</script>
</body>
</html>
