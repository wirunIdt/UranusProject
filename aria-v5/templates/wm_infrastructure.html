<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#3fb950">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARIA">
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ARIA · WorldMonitor — Infrastructure & Maritime</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/aria.css">
<style>
body{overflow:hidden;margin:0}
#wm{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 42px);margin-top:42px;overflow:hidden}
#lpanel{background:#0d1117;border-right:1px solid #21262d;display:flex;flex-direction:column;overflow:hidden;z-index:500}
.lp-top{padding:7px 10px;border-bottom:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lp-title{font-size:9px;font-weight:700;color:#8b949e;letter-spacing:2px;text-transform:uppercase}
.lp-search{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:5px 9px;font-family:inherit;font-size:11px;width:calc(100% - 20px);margin:5px 10px;border-radius:4px;outline:none;display:block}
.lp-search:focus{border-color:#58a6ff}
.lp-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#21262d transparent}
.lp-scroll::-webkit-scrollbar{width:3px}.lp-scroll::-webkit-scrollbar-thumb{background:#21262d}
.lp-cat{padding:5px 12px 2px;font-size:8px;font-weight:700;color:#6e7681;letter-spacing:2px;text-transform:uppercase;margin-top:3px;border-top:1px solid #161b22}
.lr{display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(255,255,255,.02)}
.lr:hover{background:#161b22}
.cb{width:14px;height:14px;border:1px solid #30363d;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#0d1117}
.cb.on{background:#3fb950;border-color:#3fb950}
.cb.on::after{content:'✓';color:#fff;font-size:9px;line-height:1}
.lic{font-size:13px;flex-shrink:0;width:17px;text-align:center}
.lnm{font-size:11px;color:#c9d1d9;flex:1}
.lnm.off{color:#6e7681}
.lcnt{font-size:9px;color:#8b949e;background:#21262d;padding:1px 5px;border-radius:8px;flex-shrink:0}
.lb{font-size:8px;color:#0d1117;background:#3fb950;padding:1px 4px;border-radius:2px;font-weight:700;flex-shrink:0}
.lb.warn{background:#d29922}.lb.red{background:#f85149}
#mapwrap{position:relative;overflow:hidden}
#map{width:100%;height:100%}
.leaflet-popup-content-wrapper{background:#161b22;border:1px solid #30363d;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.5);color:#c9d1d9}
.leaflet-popup-tip{background:#161b22}
.leaflet-popup-content{margin:10px 14px;font-family:'Cascadia Code','Consolas',monospace;font-size:11px;color:#c9d1d9}
.pt{font-weight:700;color:#58a6ff;font-size:13px;margin-bottom:6px;border-bottom:1px solid #30363d;padding-bottom:4px}
.pr{display:flex;justify-content:space-between;gap:12px;margin:2px 0;font-size:10px}
.pl{color:#8b949e}.pv{color:#c9d1d9;font-weight:600;text-align:right;max-width:160px;word-break:break-all}
.pv.ok{color:#3fb950}.pv.warn{color:#d29922}.pv.red{color:#f85149}.pv.blue{color:#58a6ff}
#ctrl{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:500}
.cbtn{padding:4px 11px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #30363d;background:rgba(13,17,23,.9);color:#8b949e;font-family:inherit;transition:all .14s;letter-spacing:.5px}
.cbtn:hover{color:#c9d1d9;border-color:#8b949e}
#live-ind{position:absolute;top:8px;left:8px;z-index:500;display:flex;align-items:center;gap:6px;background:rgba(13,17,23,.85);border:1px solid #21262d;border-radius:4px;padding:3px 9px;font-size:10px;color:#8b949e;pointer-events:none}
#ticker{position:absolute;bottom:0;left:0;right:0;height:24px;background:rgba(13,17,23,.9);border-top:1px solid #21262d;display:flex;align-items:center;overflow:hidden;z-index:400;pointer-events:none}
#tick-inner{display:flex;gap:20px;animation:tickm 90s linear infinite;white-space:nowrap;padding:0 12px;font-size:10px;font-family:inherit}
@keyframes tickm{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti-l{color:#6e7681}.ti-v{color:#c9d1d9;font-weight:600}
#wx-panel{position:absolute;right:0;top:0;width:270px;background:#0d1117;border-left:1px solid #21262d;z-index:600;overflow-y:auto;max-height:calc(100vh - 42px);display:none;scrollbar-width:thin}
#wx-panel.open{display:block}
.wx-stat{background:#161b22;border-radius:4px;padding:5px 8px;margin-bottom:3px}
.wx-sl{font-size:8px;color:#6e7681;text-transform:uppercase;letter-spacing:.5px}
.wx-sv{font-size:12px;font-weight:700;color:#c9d1d9;margin-top:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:768px){
  #wm{grid-template-columns:1fr}
  #lpanel{position:absolute;left:0;top:0;width:240px;height:100%;z-index:700;transform:translateX(-100%);transition:transform .3s}
  #lpanel.open{transform:translateX(0)}
  #ml-btn{display:flex!important}
}
#ml-btn{display:none;position:absolute;top:8px;left:8px;z-index:500;background:rgba(13,17,23,.9);border:1px solid #30363d;color:#c9d1d9;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;align-items:center;gap:5px}
</style>
</head>
<div class="aria-topbar">
  <button class="aria-hamburger" onclick="toggleMobileNav()">☰</button>
  <span class="aria-logo">ARIA</span>
  <span class="aria-sep">·</span>
  <span class="aria-page" style="color:var(--t2)">WorldMonitor</span>
  <span style="color:#30363d;font-size:11px;margin-left:4px">/</span>
  <span class="aria-page" style="color:var(--green)">&nbsp;Infrastructure & Maritime</span>
  <nav class="aria-nav">
    <a href="/worldmonitor">⊞ Hub</a>
    <a href="/wm/security">⚔ Security</a>
    <a href="/wm/infrastructure" class="active">🌐 Infra</a>
    <a href="/wm/economy">✈ Economy</a>
    <a href="/wm/natural">🌍 Natural</a>
    <a href="/finance">Finance</a>
  </nav>
  <div class="aria-topbar-right">
    <div class="aria-status-dot" id="live-dot" style="background:var(--yellow)"></div>
    <span style="font-size:10px;color:var(--t2)" id="wm-ts">--</span>
  </div>
</div>
<nav class="aria-mobile-nav" id="mobile-nav">
  <a href="/worldmonitor">⊞ Hub</a><a href="/wm/security">⚔ Security</a>
  <a href="/wm/infrastructure">🌐 Infra</a><a href="/wm/economy">✈ Economy</a>
  <a href="/wm/natural">🌍 Natural</a><a href="/finance">Finance</a>
</nav>
<div id="wm">
  <div id="lpanel">
    <div class="lp-top">
      <span class="lp-title">Layers</span>
      <div style="display:flex;gap:5px">
        <button onclick="setAll(true)" style="background:none;border:none;color:#3fb950;font-size:10px;cursor:pointer;font-family:inherit">All</button>
        <button onclick="setAll(false)" style="background:none;border:none;color:#f85149;font-size:10px;cursor:pointer;font-family:inherit">None</button>
      </div>
    </div>
    <input class="lp-search" placeholder="Search layers..." oninput="filterLayers(this.value)">
    <div class="lp-scroll" id="layer-list"></div>
  </div>
  <div id="mapwrap">
    <button id="ml-btn" onclick="document.getElementById('lpanel').classList.toggle('open')">⊞ Layers</button>
    <div id="map"></div>
    <div id="live-ind"><div id="ld" style="width:7px;height:7px;border-radius:50%;background:#d29922;animation:pulse 2s ease-in-out infinite"></div><span id="live-txt">Loading...</span></div>
    <div id="ctrl">
      <button class="cbtn" onclick="toggleWx()" id="wx-btn">🌤 Weather</button>
      <button class="cbtn" onclick="map.setView([20,10],2)">🌍 Reset</button>
      <button class="cbtn" onclick="reloadAll()">↺ Refresh</button>
    </div>
    <div id="ticker"><div id="tick-inner">Loading...</div></div>
    <div id="wx-panel">
      <div style="padding:10px 12px 0;display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;font-weight:700;color:#c9d1d9">Weather Forecast</span>
        <button onclick="closeWx()" style="background:none;border:none;color:#8b949e;font-size:16px;cursor:pointer;margin-left:auto">×</button>
      </div>
      <div style="padding:5px 12px 6px;display:flex;gap:5px">
        <input id="wx-city" value="Bangkok" style="flex:1;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:4px 7px;font-family:inherit;font-size:11px;border-radius:4px;outline:none" onkeydown="if(event.key==='Enter')loadWx()">
        <button onclick="loadWx()" style="background:none;border:1px solid #30363d;color:#8b949e;padding:4px 9px;cursor:pointer;border-radius:4px;font-family:inherit;font-size:10px">Go</button>
      </div>
      <div id="wx-body" style="padding:0 12px 10px"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/aria.js"></script>
<script>
let map, _layers={}, _groups={};
const DEFS=[];
function defLayer(id,nm,ic,on,live,col,type,src){DEFS.push({id,nm,ic,on,live,col,type,src});_layers[id]=on;_groups[id]=null;}

function initMap(){
  map=L.map('map',{center:[20,10],zoom:2,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',pane:'shadowPane'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.control.attribution({position:'bottomleft'}).addTo(map).setPrefix('<span style="color:#6e7681;font-size:9px">ARIA · CartoDB · USGS · OpenSky · NOAA · submarinecablemap.com</span>');
}

function buildPanel(){
  let html='';
  DEFS.forEach(l=>{
    if(l.cat){html+=`<div class="lp-cat">${l.cat}</div>`;return;}
    html+=`<div class="lr" id="lr-${l.id}" onclick="toggle('${l.id}')">
      <div class="cb${l.on?' on':''}" id="cb-${l.id}"></div>
      <span class="lic">${l.ic}</span>
      <span class="lnm${l.on?'':' off'}" id="nm-${l.id}">${l.nm}</span>
      ${l.live?`<span class="lb" id="bd-${l.id}">LIVE</span>`:''}
      <span class="lcnt" id="cnt-${l.id}" style="display:none">0</span>
    </div>`;
  });
  document.getElementById('layer-list').innerHTML=html;
}

function toggle(id){
  _layers[id]=!_layers[id];
  const cb=document.getElementById('cb-'+id),nm=document.getElementById('nm-'+id);
  if(cb)cb.className='cb'+(_layers[id]?' on':'');
  if(nm)nm.className='lnm'+(_layers[id]?'':' off');
  _layers[id]?loadLayer(id):clearLayer(id);
}
function setAll(on){DEFS.forEach(l=>{if(!l.id)return;if(_layers[l.id]!==on){_layers[l.id]=on;const cb=document.getElementById('cb-'+l.id),nm=document.getElementById('nm-'+l.id);if(cb)cb.className='cb'+(on?' on':'');if(nm)nm.className='lnm'+(on?'':' off');on?loadLayer(l.id):clearLayer(l.id);}});}
function filterLayers(q){q=q.toLowerCase();DEFS.forEach(l=>{if(!l.id)return;const r=document.getElementById('lr-'+l.id);if(r)r.style.display=(!q||l.nm.toLowerCase().includes(q))?'':'none';});}
function clearLayer(id){if(_groups[id]){map.removeLayer(_groups[id]);_groups[id]=null;}setCnt(id,'');}
function setCnt(id,n){const el=document.getElementById('cnt-'+id);if(el){el.textContent=n;el.style.display=n?'':'none';}}

function popRows(d){
  const skip=['lat','lon','latitude','longitude','pts','b'];
  return Object.entries(d).filter(([k,v])=>!skip.includes(k)&&v!==null&&v!==''&&v!==undefined).slice(0,10).map(([k,v])=>`<div class="pr"><span class="pl">${k}</span><span class="pv">${String(v).slice(0,60)}</span></div>`).join('');
}
function mkIcon(ic,col){return L.divIcon({html:`<div style="font-size:14px;filter:drop-shadow(0 0 3px ${col||'#58a6ff'})">${ic}</div>`,iconSize:[20,20],iconAnchor:[10,10],className:''});}

async function loadLayer(id){
  const def=DEFS.find(l=>l.id===id);if(!def||!_layers[id])return;
  clearLayer(id);
  const g=L.layerGroup().addTo(map);_groups[id]=g;
  try{
    if(typeof def.src==='function'){await def.src(g,id);}
    else{
      const d=await api('GET',def.src);
      if(!d||d.error)return;
      const arr=Array.isArray(d)?d:(d.features||d.quakes||[]);
      if(def.type==='quake')rQuakes(arr,g,id);
      else if(def.type==='fire')rFires(arr,g,id);
      else if(def.type==='zone')rZones(arr,g,id,def.col);
      else if(def.type==='pipeline')rPipelines(arr,g,id);
      else if(def.type==='event')rEvents(arr,g,id);
      else if(def.type==='line')rLines(arr,g,id,def.col);
      else rPoints(arr,g,id,def);
    }
  }catch(e){console.warn(id,e);}
}

function rPoints(arr,g,id,def){
  let c=0;
  arr.forEach(item=>{
    const lat=item.lat??item.latitude,lon=item.lon??item.longitude;
    if(lat===undefined||lon===undefined||isNaN(lat)||isNaN(lon))return;
    const m=L.marker([lat,lon],{icon:mkIcon(def.ic,def.col)}).addTo(g);
    m.bindPopup(`<div class="pt">${def.ic} ${item.n||item.name||def.nm}</div>${popRows(item)}`,{maxWidth:240});
    c++;
  });
  setCnt(id,c);
}

function rQuakes(arr,g,id){
  arr.forEach(q=>{
    const mag=q.mag||0,col=mag>=7?'#f85149':mag>=5?'#d29922':'#3fb950';
    const r=Math.max(5,Math.min(22,mag*2.8));
    if(mag>=6){const p=L.circleMarker([q.lat,q.lon],{radius:r*2.2,fillColor:col,color:col,weight:0,fillOpacity:.08}).addTo(g);p.on('add',()=>{});}
    L.circleMarker([q.lat,q.lon],{radius:r,fillColor:col,color:col,weight:1,fillOpacity:.65}).addTo(g)
      .bindPopup(`<div class="pt">🔴 M${mag} Earthquake</div><div class="pr"><span class="pl">Place</span><span class="pv">${(q.place||'').slice(0,40)}</span></div><div class="pr"><span class="pl">Depth</span><span class="pv">${q.depth}km</span></div><div class="pr"><span class="pl">Time</span><span class="pv">${new Date(q.time).toLocaleString()}</span></div>${q.tsunami?'<div class="pr"><span class="pl" style="color:#f85149">⚠ TSUNAMI</span><span class="pv red">WARNING</span></div>':''}`,{maxWidth:240});
  });
  setCnt(id,arr.length);
}

function rFires(arr,g,id){
  if(arr.error)return;
  arr.slice(0,3000).forEach(f=>L.circleMarker([f.lat,f.lon],{radius:2.5,fillColor:'#f97316',color:'#f97316',weight:0,fillOpacity:.7}).addTo(g));
  setCnt(id,Math.min(arr.length,3000));
}

function rZones(arr,g,id,col){
  arr.forEach(z=>{
    L.circle([z.lat,z.lon],{radius:(z.r||150)*1000,fillColor:col,color:col,weight:1,fillOpacity:.1}).addTo(g)
      .bindPopup(`<div class="pt">📡 ${z.n}</div><div class="pr"><span class="pl">Intensity</span><span class="pv warn">${z.intensity}</span></div><div class="pr"><span class="pl">Radius</span><span class="pv">${z.r}km</span></div><div class="pr"><span class="pl">Since</span><span class="pv">${z.since}</span></div>`,{maxWidth:200});
  });
  setCnt(id,arr.length);
}

function rPipelines(arr,g,id){
  arr.forEach(p=>{
    if(!p.pts)return;
    const col=p.type==='gas'?'#58a6ff':'#d29922';
    L.polyline(p.pts.map(c=>[c[1],c[0]]),{color:col,weight:2.5,opacity:.75,dashArray:p.status==='damaged'?'6,4':null}).addTo(g)
      .bindPopup(`<div class="pt">🛢 ${p.n}</div><div class="pr"><span class="pl">Type</span><span class="pv">${p.type}</span></div><div class="pr"><span class="pl">Route</span><span class="pv">${p.from_}→${p.to}</span></div>`,{maxWidth:220});
  });
  setCnt(id,arr.length);
}

function rEvents(arr,g,id){
  const cc={USA:[37,-95],UK:[54,-2],China:[35,104],Russia:[60,90],Germany:[51,10],France:[46,2],Brazil:[-14,-51],India:[20,78],Japan:[36,138]};
  arr.slice(0,20).forEach(e=>{const c=cc[e.country]||[0,0];L.circleMarker(c,{radius:10,fillColor:'#f85149',color:'#f85149',weight:2,fillOpacity:.25}).addTo(g).bindPopup(`<div class="pt">📡 Internet Disruption</div><div class="pr"><span class="pl">Country</span><span class="pv">${e.country}</span></div>`,{maxWidth:200});});
  setCnt(id,arr.length);
}

function rLines(arr,g,id,col){arr.forEach(l=>{if(l.pts)L.polyline(l.pts,{color:col||'#8b949e',weight:1.2,opacity:.5,dashArray:'8,4'}).addTo(g).bindPopup(`<div class="pt">${l.n||id}</div>`,{maxWidth:180});});setCnt(id,arr.length);}

async function reloadAll(){DEFS.forEach(l=>{if(l.id&&_layers[l.id])loadLayer(l.id);});}

// Weather
function toggleWx(){const p=document.getElementById('wx-panel');p.classList.toggle('open');document.getElementById('wx-btn').style.color=p.classList.contains('open')?'#58a6ff':'#8b949e';if(p.classList.contains('open')&&!document.getElementById('wx-body').innerHTML)loadWx();}
function closeWx(){document.getElementById('wx-panel').classList.remove('open');}
async function loadWx(){
  const city=(document.getElementById('wx-city').value||'Bangkok').trim();
  document.getElementById('wx-body').innerHTML='<div style="color:#8b949e;font-size:11px;padding:6px 0">Loading...</div>';
  const d=await api('GET',`/api/wm/weather_fixed?city=${encodeURIComponent(city)}`);
  if(!d||d.error){document.getElementById('wx-body').innerHTML=`<div style="color:#f85149;font-size:11px;padding:6px 0">${d?.error||'Failed'}</div>`;return;}
  const fc=(d.forecast||[]).slice(0,5).map(f=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:#161b22;border-radius:4px;padding:5px 6px;min-width:44px;flex-shrink:0"><div style="font-size:8px;color:#6e7681">${f.date?.slice(5)}</div><div style="font-size:13px">${f.icon||'🌡'}</div><div style="font-size:11px;font-weight:700;color:#c9d1d9">${f.max}°</div><div style="font-size:9px;color:#6e7681">${f.min}°</div>${f.rain_mm>0?`<div style="font-size:8px;color:#58a6ff">💧${f.rain_mm}mm</div>`:''}</div>`).join('');
  const hourly=(d.hourly||[]).slice(0,10).map(h=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #161b22;font-size:10px;gap:4px"><span style="color:#8b949e;flex-shrink:0">${h.hour}</span><span>${h.icon}</span><span style="font-weight:700;flex-shrink:0">${h.temp}°</span><span style="color:#6e7681;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.desc?.slice(0,14)}</span>${h.rain>0?`<span style="color:#58a6ff;flex-shrink:0">💧${h.rain}mm</span>`:''}</div>`).join('');
  document.getElementById('wx-body').innerHTML=`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <div style="font-size:34px;font-weight:700;color:#3fb950;line-height:1">${d.icon||'🌡'} ${d.temp}°</div>
    <div><div style="font-size:12px;font-weight:700;color:#c9d1d9">${d.city}, ${d.country||''}</div><div style="font-size:10px;color:#8b949e;margin-top:1px">${d.desc}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:7px">
    <div class="wx-stat"><div class="wx-sl">Feels</div><div class="wx-sv">${d.feels}°C</div></div>
    <div class="wx-stat"><div class="wx-sl">Humidity</div><div class="wx-sv">${d.humidity}%</div></div>
    <div class="wx-stat"><div class="wx-sl">Wind</div><div class="wx-sv">${d.wind_kph}km/h</div></div>
    <div class="wx-stat"><div class="wx-sl">UV</div><div class="wx-sv">${d.uv_index||0}</div></div>
    <div class="wx-stat"><div class="wx-sl">Pressure</div><div class="wx-sv">${d.pressure||'--'}hPa</div></div>
    <div class="wx-stat"><div class="wx-sl">Visibility</div><div class="wx-sv">${d.visibility||'--'}km</div></div>
  </div>
  <div style="font-size:8px;font-weight:700;color:#6e7681;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">5-Day Forecast</div>
  <div style="display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none">${fc}</div>
  <div style="font-size:8px;font-weight:700;color:#6e7681;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Hourly Today</div>
  ${hourly}
  <div style="font-size:9px;color:#6e7681;margin-top:5px;text-align:right">Source: ${d.source||'wttr.in'}</div>`;
}

// Ticker
async function loadTicker(){
  try{
    const[a,b,c]=await Promise.all([api('GET','/api/finance/crypto?symbols=BTC,ETH,BNB'),api('GET','/api/finance/indices'),api('GET','/api/finance/forex')]);
    let it=[];
    if(Array.isArray(a))it.push(...a.map(d=>`<span class="ti-l">${d.symbol}</span> <span class="ti-v">$${d.price>1?d.price.toFixed(2):d.price.toFixed(5)}</span> <span style="font-size:9px;${d.change24h>0?'color:#3fb950':'color:#f85149'}">${d.change24h>0?'+':''}${d.change24h.toFixed(2)}%</span>`));
    if(Array.isArray(b))it.push(...b.slice(0,5).map(d=>`<span class="ti-l">${d.symbol}</span> <span class="ti-v">${d.price.toLocaleString()}</span> <span style="font-size:9px;${d.change24h>0?'color:#3fb950':'color:#f85149'}">${d.change24h>0?'+':''}${d.change24h.toFixed(1)}%</span>`));
    if(Array.isArray(c)){const t=c.find(f=>f.pair==='USD/THB');if(t)it.push(`<span class="ti-l">USD/THB</span> <span class="ti-v">${t.rate.toFixed(2)}</span>`);}
    const all=[...it,...it].map(i=>`<span style="flex-shrink:0">${i}</span><span style="color:#21262d;margin:0 12px">·</span>`).join('');
    document.getElementById('tick-inner').innerHTML=all;
    document.getElementById('live-dot').className='aria-status-dot green';
    document.getElementById('wm-ts').textContent=new Date().toLocaleTimeString();
  }catch{}
}

async function loadAllCables(g, id){
  const bd=document.getElementById('bd-'+id);
  if(bd){bd.textContent='Fetching...';bd.className='lb warn';}
  document.getElementById('live-txt').textContent='Loading cables from submarinecablemap.com...';

  // Try live API first
  try {
    const list = await api('GET','/api/wm/cables_list');
    if(Array.isArray(list) && list.length > 0){
      let loaded=0;
      const BATCH=15;
      for(let i=0;i<Math.min(list.length,200);i+=BATCH){
        const batch=list.slice(i,i+BATCH);
        await Promise.all(batch.map(async cable=>{
          try{
            const r=await fetch(`/api/wm/cable_route/${cable.id||cable.cable_id}`).then(x=>x.json());
            const feats=r.features||[];
            feats.forEach(f=>{
              const geo=f.geometry;if(!geo)return;
              const draw=(coords)=>{
                const ll=coords.filter(c=>Array.isArray(c)&&c.length>=2&&!Array.isArray(c[0])).map(c=>[c[1],c[0]]);
                if(ll.length<2)return;
                L.polyline(ll,{color:cable.color||'#f97316',weight:1.8,opacity:.75}).addTo(g)
                  .bindPopup(`<div class="pt">⚡ ${cable.name}</div><div class="pr"><span class="pl">Length</span><span class="pv">${cable.length||'--'}</span></div><div class="pr"><span class="pl">Year</span><span class="pv">${cable.year_of_deployment||'--'}</span></div>`,{maxWidth:220});
                loaded++;
              };
              if(geo.type==='MultiLineString')geo.coordinates?.forEach(draw);
              else if(geo.type==='LineString')draw(geo.coordinates||[]);
            });
          }catch{}
        }));
        document.getElementById('live-txt').textContent=`Cables: ${loaded} segments loaded...`;
        await new Promise(r=>setTimeout(r,50));
      }
      setCnt(id,list.length+' cables');
      if(bd){bd.textContent=list.length+' cables';bd.className='lb';}
      document.getElementById('live-txt').textContent=`${list.length} cables loaded`;
      return;
    }
  } catch(e){console.warn('live cables failed, using built-in',e);}

  // Built-in fallback with 50+ real cables
  loadBuiltinCables(g,id);
}

async function loadLandingPts(g,id){
  try{
    const d=await api('GET','/api/wm/landing_pts');
    if(d.error||!Array.isArray(d))return;
    d.forEach(lp=>{
      const c=lp.geometry?.coordinates;if(!c||c.length<2)return;
      L.circleMarker([c[1],c[0]],{radius:4,fillColor:'#d2a8ff',color:'#d2a8ff',weight:1.5,fillOpacity:.8}).addTo(g)
        .bindPopup(`<div class="pt">📍 ${lp.properties?.name||'Landing Point'}</div><div class="pr"><span class="pl">Country</span><span class="pv">${lp.properties?.country||''}</span></div>`,{maxWidth:200});
    });
    setCnt(id,d.length);
  }catch(e){console.warn(e);}
}
