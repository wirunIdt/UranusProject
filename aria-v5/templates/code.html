<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#3fb950">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARIA">
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIA — Code IDE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1117;color:#c9d1d9;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr 260px;grid-template-rows:40px 1fr 180px;height:100vh}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:#161b22;border-bottom:1px solid #30363d}
.logo{color:#58a6ff;font-weight:700;font-size:15px}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px;transition:all .15s}
.nav a:hover{color:#c9d1d9;background:#21262d}
.nav a.active{color:#58a6ff}
.tr{margin-left:auto;display:flex;gap:8px;align-items:center}
.tr-btn{background:none;border:1px solid #3fb950;color:#3fb950;padding:3px 12px;cursor:pointer;font-family:inherit;border-radius:4px;font-size:12px}
.tr-btn:hover{background:rgba(63,185,80,.15)}
.tr-btn.run{background:#3fb950;color:#0d1117;font-weight:700}

/* Sidebar */
#sb{background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
.pt{padding:7px 12px;font-size:10px;font-weight:700;color:#8b949e;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #21262d;display:flex;align-items:center;justify-content:space-between}
.pt button{background:none;border:none;color:#8b949e;cursor:pointer;font-size:16px;line-height:1}
.pt button:hover{color:#58a6ff}
.ps{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#30363d transparent}
.ps::-webkit-scrollbar{width:3px}
.ps::-webkit-scrollbar-thumb{background:#30363d}
.tree-item{display:flex;align-items:center;gap:5px;padding:4px 10px;cursor:pointer;color:#8b949e;font-size:12px;transition:background .1s;white-space:nowrap;overflow:hidden}
.tree-item:hover{background:#21262d;color:#c9d1d9}
.tree-item.selected{background:#21262d;color:#58a6ff}
.tree-item.dir{font-weight:700}
.tree-icon{width:14px;text-align:center;flex-shrink:0}
#path-input{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:3px 8px;font-family:inherit;font-size:11px;width:calc(100% - 8px);margin:4px;border-radius:3px;outline:none}

/* Editor */
#editor-area{display:flex;flex-direction:column;overflow:hidden}
#tab-bar{display:flex;background:#161b22;border-bottom:1px solid #30363d;overflow-x:auto;scrollbar-width:none}
#tab-bar::-webkit-scrollbar{display:none}
.etab{display:flex;align-items:center;gap:8px;padding:0 14px;height:34px;font-size:12px;cursor:pointer;color:#8b949e;border-right:1px solid #30363d;white-space:nowrap;transition:color .15s;position:relative;flex-shrink:0}
.etab:hover{color:#c9d1d9}
.etab.active{color:#c9d1d9;background:#0d1117}
.etab.active::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#58a6ff}
.etab.dirty::before{content:'●';color:#d29922;font-size:8px;margin-right:2px}
.etab .tc{background:none;border:none;color:#8b949e;cursor:pointer;font-size:14px;line-height:1}
.etab .tc:hover{color:#f85149}
.new-tab{padding:0 12px;height:34px;background:none;border:none;color:#8b949e;cursor:pointer;font-size:18px}
.new-tab:hover{color:#58a6ff}
#editor-wrap{flex:1;display:flex;overflow:hidden}
#lnums{padding:8px 0;background:#161b22;border-right:1px solid #30363d;min-width:42px;text-align:right;font-size:13px;line-height:1.6;color:#8b949e;overflow:hidden;user-select:none}
.ln{padding:0 8px}
#editor{flex:1;padding:8px 12px;font-size:13px;line-height:1.6;background:#0d1117;outline:none;resize:none;color:#c9d1d9;tab-size:4;white-space:pre;overflow:auto;scrollbar-width:thin;scrollbar-color:#30363d transparent;caret-color:#58a6ff;font-family:inherit}
#editor::-webkit-scrollbar{width:5px}
#editor::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* Terminal bottom */
#term-area{grid-column:1/-1;border-top:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
#term-tabs{display:flex;background:#161b22;border-bottom:1px solid #30363d}
.tt{padding:5px 14px;font-size:11px;cursor:pointer;color:#8b949e;border-right:1px solid #30363d;transition:all .15s}
.tt:hover{color:#c9d1d9}
.tt.active{color:#58a6ff;background:#0d1117}
#term-out{flex:1;overflow-y:auto;padding:6px 12px;font-size:12px;line-height:1.5;scrollbar-width:thin;scrollbar-color:#30363d transparent}
.tok{color:#a5d6ff}.terr{color:#f85149}.twarn{color:#d29922}.tcmd{color:#3fb950}.tsys{color:#8b949e}
#term-in-row{display:flex;padding:4px 8px;border-top:1px solid #30363d;align-items:center}
.tp{color:#3fb950;margin-right:8px;font-size:12px}
#tinput{flex:1;background:transparent;border:none;outline:none;color:#3fb950;font-family:inherit;font-size:12px}

/* Right panel */
#rpanel{background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
.outline-item{padding:4px 12px;font-size:11px;cursor:pointer;color:#8b949e;display:flex;align-items:center;gap:5px;transition:background .1s}
.outline-item:hover{background:#21262d;color:#c9d1d9}
.oi-fn{color:#d2a8ff}.oi-cl{color:#d29922}.oi-im{color:#a5d6ff}
.var-row{display:flex;justify-content:space-between;padding:2px 12px;font-size:11px}
.vn{color:#58a6ff}.vv{color:#8b949e}
.git-btn{display:block;width:100%;padding:4px 10px;margin:2px 4px;background:#21262d;border:1px solid #30363d;color:#8b949e;font-family:inherit;font-size:11px;cursor:pointer;border-radius:3px;text-align:left;transition:all .15s}
.git-btn:hover{color:#c9d1d9;border-color:#8b949e}
#git-out{flex:1;overflow-y:auto;padding:6px 10px;font-size:10px;color:#a5d6ff;white-space:pre-wrap;scrollbar-width:thin}
#commit-msg{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:3px 8px;font-family:inherit;font-size:11px;border-radius:3px;width:calc(100%-8px);margin:4px;outline:none}

/* Status bar */
#statusbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px;background:rgba(88,166,255,.08);border-top:1px solid #58a6ff22;font-size:10px;color:#8b949e;height:22px}
#statusbar span{color:#58a6ff}
.sbr{margin-left:auto;display:flex;gap:14px}

.aria-hamburger{display:none;background:none;border:none;color:#8b949e;font-size:19px;cursor:pointer;padding:3px;line-height:1}
.aria-mobile-nav{display:none;position:fixed;top:40px;left:0;right:0;z-index:99;background:#161b22;border-bottom:1px solid #30363d;padding:6px 10px;flex-direction:column;gap:1px}
.aria-mobile-nav.open{display:flex}
.aria-mobile-nav a{color:#8b949e;text-decoration:none;font-size:12px;padding:8px 10px;border-radius:4px}
.aria-mobile-nav a.active{color:#3fb950}
.aria-mobile-nav a:hover{background:#21262d;color:#c9d1d9}
@media(max-width:768px){
  .aria-hamburger{display:block}
  #topbar .nav{display:none}
}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <span class="logo">ARIA</span>
  <nav class="nav">
    <a href="/">Terminal</a>
    <a href="/code" class="active" class="active">Code IDE</a>
    <a href="/network">Network</a>
    <a href="/intranet">Intranet</a>
    <a href="/status">Status</a>
  </nav>
  <div class="tr">
    <button class="tr-btn" onclick="saveFile()">Save ⌘S</button>
    <button class="tr-btn run" onclick="runCode()">▶ Run F5</button>
  </div>
</div>

<div id="sb">
  <div class="pt">Explorer<div style="display:flex;gap:4px"><button onclick="newFile()" title="New File">+</button><button onclick="loadTree()" title="Refresh">↺</button></div></div>
  <input id="path-input" value="." placeholder="path" onkeydown="if(event.key==='Enter')loadTree()">
  <div class="ps"><div id="file-tree"></div></div>
</div>

<div id="editor-area">
  <div id="tab-bar"><button class="new-tab" onclick="newTab()">+</button></div>
  <div id="editor-wrap">
    <div id="lnums"></div>
    <textarea id="editor" placeholder="// Open a file or start typing..." spellcheck="false"
      oninput="onEditorInput()" onkeydown="editorKey(event)" onscroll="syncScroll()"></textarea>
  </div>
</div>

<div id="rpanel">
  <div class="pt">Outline</div>
  <div class="ps" id="outline-list"></div>
  <div class="pt" style="margin-top:4px">Git</div>
  <div style="padding:4px">
    <input id="commit-msg" placeholder="commit message...">
    <button class="git-btn" onclick="git('status')">📋 Status</button>
    <button class="git-btn" onclick="git('log')">📜 Log</button>
    <button class="git-btn" onclick="git('diff')">🔀 Diff</button>
    <button class="git-btn" onclick="git('add')">+ Stage All</button>
    <button class="git-btn" onclick="doCommit()">✓ Commit</button>
    <button class="git-btn" onclick="git('push')">↑ Push</button>
    <button class="git-btn" onclick="git('pull')">↓ Pull</button>
  </div>
  <div class="ps" id="git-out" style="font-family:inherit">Ready.</div>
</div>

<div id="term-area">
  <div id="term-tabs">
    <div class="tt active" id="tt-bash" onclick="switchTerm('bash')">$ Bash</div>
    <div class="tt" id="tt-py" onclick="switchTerm('py')">⟩ Python</div>
    <div class="tt" id="tt-web" onclick="switchTerm('web')">🔍 Web Search</div>
  </div>
  <div id="term-out"></div>
  <div id="term-in-row">
    <span class="tp" id="tp">$ </span>
    <input id="tinput" placeholder="command..." autocomplete="off" onkeydown="termKey(event)">
  </div>
</div>
</div>

<script>
let tabs=[], activeTab=null, currentTerm='bash', termHist=[], thistIdx=-1;

// ── Tabs ──────────────────────────────────────────────────────────────────
function newTab(path='',content=''){
  const id=Date.now();
  const name=path.split('/').pop()||'untitled';
  const tab={id,path,name,content,dirty:false,lang:detectLang(name)};
  tabs.push(tab); switchTab(id); return tab;
}
function switchTab(id){
  if(activeTab) activeTab.content=document.getElementById('editor').value;
  activeTab=tabs.find(t=>t.id===id);
  if(!activeTab) return;
  document.getElementById('editor').value=activeTab.content;
  document.getElementById('statusbar').querySelector('#sb-file').textContent=activeTab.name;
  document.getElementById('statusbar').querySelector('#sb-lang').textContent=activeTab.lang;
  renderTabs(); updateLnums(); analyzeOutline();
}
function closeTab(id){
  const idx=tabs.findIndex(t=>t.id===id); tabs.splice(idx,1);
  if(activeTab?.id===id){activeTab=tabs[idx]||tabs[idx-1]||null;if(activeTab)switchTab(activeTab.id);else document.getElementById('editor').value='';}
  renderTabs();
}
function renderTabs(){
  const bar=document.getElementById('tab-bar');
  const nb=bar.querySelector('.new-tab'); bar.innerHTML=''; bar.appendChild(nb);
  tabs.forEach(t=>{
    const d=document.createElement('div');
    d.className='etab'+(t.id===activeTab?.id?' active':'')+(t.dirty?' dirty':'');
    d.innerHTML=`<span>${esc(t.name)}</span><button class="tc" onclick="event.stopPropagation();closeTab(${t.id})">×</button>`;
    d.onclick=()=>switchTab(t.id); bar.insertBefore(d,nb);
  });
}

// ── Editor ─────────────────────────────────────────────────────────────────
function onEditorInput(){
  if(activeTab){activeTab.content=document.getElementById('editor').value;activeTab.dirty=true;}
  updateLnums(); updateCursor(); renderTabs();
}
function updateLnums(){
  const ed=document.getElementById('editor');
  const n=ed.value.split('\n').length;
  document.getElementById('lnums').innerHTML=Array.from({length:n},(_,i)=>`<div class="ln">${i+1}</div>`).join('');
}
function syncScroll(){document.getElementById('lnums').scrollTop=document.getElementById('editor').scrollTop;}
function updateCursor(){
  const ed=document.getElementById('editor');
  const text=ed.value.substring(0,ed.selectionStart).split('\n');
  document.getElementById('sb-cursor').textContent=text.length+':'+(text[text.length-1].length+1);
}
function editorKey(e){
  if(e.key==='Tab'){e.preventDefault();const ed=e.target,s=ed.selectionStart;ed.value=ed.value.substring(0,s)+'    '+ed.value.substring(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+4;onEditorInput();}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveFile();}
  if(e.key==='F5'){e.preventDefault();runCode();}
}

// ── File ops ──────────────────────────────────────────────────────────────
async function loadTree(){
  const p=document.getElementById('path-input').value||'.';
  const r=await api('GET','/api/fs/list?path='+encodeURIComponent(p));
  if(r.error){tprint('ERR: '+r.error,'terr');return;}
  document.getElementById('file-tree').innerHTML=r.items.map(item=>`
    <div class="tree-item${item.type==='dir'?' dir':''}" onclick="${item.type==='dir'?`openDir('${esc(item.path)}')`:`openFile('${esc(item.path)}')`}">
      <span class="tree-icon">${item.type==='dir'?'📁':fileIcon(item.ext)}</span>
      <span>${esc(item.name)}</span>
    </div>`).join('');
}
function openDir(p){document.getElementById('path-input').value=p;loadTree();}
async function openFile(p){
  const ex=tabs.find(t=>t.path===p); if(ex){switchTab(ex.id);return;}
  const r=await api('GET','/api/fs/read?path='+encodeURIComponent(p));
  if(r.error){tprint('ERR: '+r.error,'terr');return;}
  const t=newTab(p,r.content); t.dirty=false; renderTabs();
}
async function saveFile(){
  if(!activeTab) return;
  if(!activeTab.path){const p=prompt('Save as:',activeTab.name||'untitled.txt');if(!p)return;activeTab.path=p;activeTab.name=p.split('/').pop();}
  const r=await api('POST','/api/fs/write',{path:activeTab.path,content:document.getElementById('editor').value});
  if(r.ok){activeTab.dirty=false;renderTabs();tprint('Saved: '+activeTab.path,'tok');}
  else tprint('Error: '+r.error,'terr');
}
function newFile(){newTab('','');}

// ── Run code ──────────────────────────────────────────────────────────────
async function runCode(){
  const code=document.getElementById('editor').value; if(!code.trim())return;
  const lang=activeTab?.lang||'';
  if(lang==='Python'){
    tprint('⟩ Running Python...','tsys');
    const r=await api('POST','/api/python',{code});
    if(r.stdout)r.stdout.trimEnd().split('\n').forEach(l=>tprint(l,'tok'));
    if(r.error)tprint(r.error,'terr');
  }else{
    tprint('$ '+activeTab?.path,'tsys');
    const r=await api('POST','/api/shell',{cmd:`bash "${activeTab?.path||''}"`});
    if(r.stdout)r.stdout.trimEnd().split('\n').forEach(l=>tprint(l,'tok'));
    if(r.stderr)r.stderr.trimEnd().split('\n').forEach(l=>tprint(l,'twarn'));
  }
}

// ── Terminal ──────────────────────────────────────────────────────────────
function tprint(txt,cls='tok'){
  const el=document.getElementById('term-out');
  const d=document.createElement('div');d.className=cls;d.textContent=txt;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function switchTerm(t){
  currentTerm=t;
  ['bash','py','web'].forEach(x=>document.getElementById('tt-'+x)?.classList.toggle('active',x===t));
  document.getElementById('tp').textContent={bash:'$ ',py:'⟩ ',web:'🔍 '}[t]||'$ ';
  document.getElementById('tinput').placeholder={bash:'shell command',py:'Python code',web:'search query'}[t];
}
async function termKey(e){
  const inp=document.getElementById('tinput');
  if(e.key==='Enter'){
    const cmd=inp.value.trim(); if(!cmd)return;
    termHist.unshift(cmd);thistIdx=-1;
    tprint((currentTerm==='bash'?'$ ':currentTerm==='py'?'⟩ ':'🔍 ')+cmd,'tcmd');
    inp.value='';
    if(currentTerm==='bash'){
      const r=await api('POST','/api/shell',{cmd});
      if(r.stdout)r.stdout.trimEnd().split('\n').forEach(l=>tprint(l,'tok'));
      if(r.stderr)r.stderr.trimEnd().split('\n').forEach(l=>tprint(l,'terr'));
    }else if(currentTerm==='py'){
      const r=await api('POST','/api/python',{code:cmd});
      if(r.stdout)tprint(r.stdout.trimEnd(),'tok');
      if(r.error)tprint(r.error,'terr');
    }else{
      const r=await api('GET','/api/websearch?q='+encodeURIComponent(cmd));
      (r.results||[]).slice(0,5).forEach(x=>tprint(x.title+'\n  '+x.href,'tok'));
    }
  }
  if(e.key==='ArrowUp'){e.preventDefault();if(thistIdx<termHist.length-1){thistIdx++;inp.value=termHist[thistIdx];}}
  if(e.key==='ArrowDown'){e.preventDefault();if(thistIdx>0){thistIdx--;inp.value=termHist[thistIdx];}else{thistIdx=-1;inp.value='';}}
}

// ── Git ───────────────────────────────────────────────────────────────────
async function git(action){
  const r=await api('POST','/api/git',{action,cwd:document.getElementById('path-input').value});
  document.getElementById('git-out').textContent=(r.stdout||'')+(r.stderr?'\n'+r.stderr:'');
}
async function doCommit(){
  const msg=document.getElementById('commit-msg').value||'Update';
  await git('add');
  const r=await api('POST','/api/git',{action:'commit',message:msg});
  document.getElementById('git-out').textContent=r.stdout||r.stderr;
}

// ── Outline ───────────────────────────────────────────────────────────────
async function analyzeOutline(){
  const code=document.getElementById('editor').value;
  if(!code.includes('def ')&&!code.includes('class ')){document.getElementById('outline-list').innerHTML='<div style="padding:8px 12px;font-size:11px;color:#8b949e">No symbols</div>';return;}
  const r=await api('POST','/api/ast',{code});
  if(!r.nodes){return;}
  const fns=r.nodes.filter(n=>n.type==='FunctionDef');
  const cls=r.nodes.filter(n=>n.type==='ClassDef');
  let html='';
  cls.forEach(c=>html+=`<div class="outline-item oi-cl">⊕ ${esc(c.name)} L${c.line}</div>`);
  fns.forEach(f=>html+=`<div class="outline-item oi-fn">⊙ ${esc(f.name)}(${(f.args||[]).join(',')}) L${f.line}</div>`);
  document.getElementById('outline-list').innerHTML=html||'<div style="padding:8px 12px;font-size:11px;color:#8b949e">No symbols</div>';
}

// ── Helpers ───────────────────────────────────────────────────────────────
function detectLang(n){const m={py:'Python',js:'JavaScript',ts:'TypeScript',html:'HTML',css:'CSS',json:'JSON',sh:'Shell',md:'Markdown',rs:'Rust',go:'Go'};return m[n.split('.').pop()?.toLowerCase()]||'Text';}
function fileIcon(ext){const m={py:'🐍',js:'📜',ts:'📘',html:'🌐',css:'🎨',json:'{}',sh:'$',md:'📝',txt:'📄'};return m[ext]||'📄';}
async function api(m,u,b){try{const o={method:m,headers:{'Content-Type':'application/json'}};if(b&&m!=='GET')o.body=JSON.stringify(b);return await(await fetch(u,o)).json();}catch(e){return{error:e.message};}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Init ──────────────────────────────────────────────────────────────────
loadTree();
newTab('','// ARIA Code IDE\n// Open a file from the sidebar, or start coding here\n// F5 = Run  |  Ctrl+S = Save\n');
document.getElementById('editor').addEventListener('click',updateCursor);
document.getElementById('editor').addEventListener('keyup',updateCursor);
tprint('ARIA Code IDE ready  —  F5 run, Ctrl+S save, Tab indent','tsys');
</script>

<!-- Status bar (outside #app grid-area, overlaid) -->
<div id="statusbar" style="grid-column:1/-1">
  <span id="sb-file">untitled</span>
  <span id="sb-cursor">1:1</span>
  <div class="sbr">
    <span id="sb-lang">Text</span>
    <span id="sb-enc">UTF-8</span>
  </div>
</div>
</div>
<script src="/static/aria.js"></script>
</body>
</html>
