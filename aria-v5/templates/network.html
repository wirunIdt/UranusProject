<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#3fb950">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARIA">
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIA — Network</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1117;color:#c9d1d9;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;overflow:hidden}
#app{display:grid;grid-template-columns:220px 1fr 220px;grid-template-rows:40px 1fr;height:100vh}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:#161b22;border-bottom:1px solid #30363d}
.logo{color:#58a6ff;font-weight:700;font-size:15px}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px;transition:all .15s}
.nav a:hover{color:#c9d1d9;background:#21262d}.nav a.active{color:#58a6ff}
.tr{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:#8b949e}
.trbtn{background:none;border:1px solid #30363d;color:#8b949e;padding:3px 10px;cursor:pointer;font-family:inherit;border-radius:4px;font-size:11px;transition:all .15s}
.trbtn:hover{color:#c9d1d9;border-color:#8b949e}
.pt{padding:7px 12px;font-size:10px;font-weight:700;color:#8b949e;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #21262d}
.ps{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#30363d transparent}
.ps::-webkit-scrollbar{width:3px}
.ps::-webkit-scrollbar-thumb{background:#30363d}

#lcol{background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
#rcol{background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}

/* Node list */
.node-card{padding:8px 12px;border-bottom:1px solid #21262d;cursor:pointer;transition:background .1s}
.node-card:hover{background:#21262d}
.node-card.self{border-left:2px solid #58a6ff}
.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.nc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nc-name{color:#c9d1d9;font-size:12px;font-weight:600}
.nc-id{color:#8b949e;font-size:10px}
.nc-ip{color:#58a6ff;font-size:11px}
.nc-act{display:flex;gap:5px;margin-top:6px}
.nbtn{background:none;border:1px solid #30363d;color:#8b949e;padding:2px 8px;cursor:pointer;font-family:inherit;font-size:10px;border-radius:3px;transition:all .15s}
.nbtn:hover{color:#c9d1d9;border-color:#8b949e}
.nbtn.ping{border-color:#3fb950;color:#3fb950}

/* Map */
#map-area{display:flex;flex-direction:column;overflow:hidden;background:#0d1117}
#map-header{padding:8px 14px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#161b22}
#map-wrap{flex:1;position:relative;overflow:hidden}
#wmap{display:block;width:100%;height:100%}
.tip{position:absolute;display:none;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;pointer-events:none;font-size:11px;z-index:10;min-width:140px}
.tip-t{font-weight:700;color:#c9d1d9;margin-bottom:4px}
.tip-r{display:flex;justify-content:space-between;gap:14px;color:#8b949e;margin:2px 0}
.tip-r span:last-child{color:#c9d1d9;font-weight:600}

/* Legend */
.leg-row{display:flex;gap:14px;font-size:11px;color:#8b949e;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px}
.ld{width:8px;height:8px;border-radius:50%}

/* Messages */
.msg-item{padding:5px 12px;border-bottom:1px solid #21262d;font-size:11px}
.msg-from{color:#d29922;font-weight:600}
.msg-body{color:#c9d1d9;margin-top:1px}
.msg-time{color:#6e7681;font-size:10px}
#send-row{display:flex;gap:5px;padding:7px 10px;border-top:1px solid #30363d}
#send-input{flex:1;background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 8px;font-family:inherit;font-size:11px;border-radius:3px;outline:none}
#send-input:focus{border-color:#58a6ff}
.sbtn{background:none;border:1px solid #58a6ff;color:#58a6ff;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px;border-radius:3px}
.sbtn:hover{background:rgba(88,166,255,.15)}

/* Stat rows */
.stat-r{display:flex;justify-content:space-between;padding:4px 12px;font-size:11px;border-bottom:1px solid #21262d}
.sl{color:#8b949e}.sv{color:#c9d1d9;font-weight:600}
.su{color:#3fb950}.sd{color:#f85149}.sn{color:#8b949e}

.aria-hamburger{display:none;background:none;border:none;color:#8b949e;font-size:19px;cursor:pointer;padding:3px;line-height:1}
.aria-mobile-nav{display:none;position:fixed;top:40px;left:0;right:0;z-index:99;background:#161b22;border-bottom:1px solid #30363d;padding:6px 10px;flex-direction:column;gap:1px}
.aria-mobile-nav.open{display:flex}
.aria-mobile-nav a{color:#8b949e;text-decoration:none;font-size:12px;padding:8px 10px;border-radius:4px}
.aria-mobile-nav a.active{color:#3fb950}
.aria-mobile-nav a:hover{background:#21262d;color:#c9d1d9}
@media(max-width:768px){
  .aria-hamburger{display:block}
  #topbar .nav{display:none}
}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <span class="logo">ARIA</span>
  <nav class="nav">
    <a href="/">Terminal</a>
    <a href="/code">Code IDE</a>
    <a href="/network" class="active" class="active">Network</a>
    <a href="/intranet">Intranet</a>
    <a href="/status">Status</a>
  </nav>
  <div class="tr">
    <button class="trbtn" onclick="scanNodes()">↺ Scan</button>
    <button class="trbtn" onclick="broadcastAll()">📢 Broadcast</button>
    <span id="peer-c">0 peers</span>
  </div>
</div>

<div id="lcol">
  <div class="pt">Mesh Nodes</div>
  <div class="ps" id="node-list" style="flex:1"><div style="padding:10px 12px;color:#8b949e;font-size:12px">Scanning...</div></div>
  <div class="pt">Stats</div>
  <div>
    <div class="stat-r"><span class="sl">Cables global</span><span class="sv">128</span></div>
    <div class="stat-r"><span class="sl">Operational</span><span class="sv su">119</span></div>
    <div class="stat-r"><span class="sl">Faults</span><span class="sv sd">3</span></div>
    <div class="stat-r"><span class="sl">Mesh UDP</span><span class="sv">47777</span></div>
    <div class="stat-r"><span class="sl">File share</span><span class="sv">:47780</span></div>
    <div class="stat-r"><span class="sl">Local DNS</span><span class="sv">:5354</span></div>
  </div>
</div>

<div id="map-area">
  <div id="map-header">
    <div style="font-size:13px;font-weight:600;color:#c9d1d9">Submarine Cable Network</div>
    <div class="leg-row">
      <div class="li"><div class="ld" style="background:#3fb950"></div>Operational</div>
      <div class="li"><div class="ld" style="background:#d29922"></div>Partial</div>
      <div class="li"><div class="ld" style="background:#f85149"></div>Fault</div>
      <div class="li"><div class="ld" style="background:#58a6ff"></div>Maintenance</div>
      <div class="li"><div class="ld" style="background:#d2a8ff"></div>Landing pt</div>
    </div>
  </div>
  <div id="map-wrap">
    <svg id="wmap" viewBox="0 0 960 400" preserveAspectRatio="xMidYMid meet" width="100%" height="100%"></svg>
    <div class="tip" id="tip"></div>
  </div>
</div>

<div id="rcol">
  <div class="pt">Mesh Chat</div>
  <div class="ps" id="msg-list" style="flex:1;max-height:260px"></div>
  <div id="send-row">
    <input id="send-input" placeholder="broadcast message..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="sbtn" onclick="sendMsg()">Send</button>
  </div>
  <div class="pt" style="margin-top:4px">Cable Registry</div>
  <div class="ps" style="flex:1">
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="border-bottom:1px solid #30363d"><th style="text-align:left;padding:4px 10px;color:#d29922;font-size:10px">Cable</th><th style="text-align:left;padding:4px 10px;color:#d29922;font-size:10px">Status</th></tr></thead>
      <tbody id="cable-mini"></tbody>
    </table>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const CABLES=[
  {n:'SEA-ME-WE 6',s:'active', c:'#3fb950',pts:[[103.8,1.3],[80,13],[60,22],[43,12],[32,30],[4.8,36.8],[2,48.5]]},
  {n:'PEACE',      s:'active', c:'#3fb950',pts:[[67,24.8],[-1,0],[43,12],[60,22],[4.8,36.8]]},
  {n:'AAE-1',      s:'partial',c:'#d29922',pts:[[139.7,35.6],[103.8,1.3],[80,13],[43,12],[32,30],[4.8,36.8]]},
  {n:'MAREA',      s:'fault',  c:'#f85149',pts:[[-76,36.8],[-28,44],[-9,38],[3,41]]},
  {n:'Dunant',     s:'active', c:'#3fb950',pts:[[-76,36.8],[-40,41],[-8.6,41.4],[3,43.5]]},
  {n:'FASTER',     s:'active', c:'#3fb950',pts:[[-122,45.5],[-175,53],[139.7,35.6]]},
  {n:'AEConnect',  s:'maint',  c:'#58a6ff',pts:[[-74,40.7],[-10,52],[-6.3,53.3],[0,51.5]]},
  {n:'BRICS',      s:'partial',c:'#d29922',pts:[[-35,-8],[18,-34],[80,13],[139.7,35.6]]},
  {n:'Pacific Light',s:'active',c:'#3fb950',pts:[[114,22.3],[150,30],[-118.2,34]]},
  {n:'FLAG Atlantic',s:'active',c:'#3fb950',pts:[[-74,40.7],[-30,48],[-3,40.4]]},
  {n:'Southern Cross',s:'active',c:'#3fb950',pts:[[151.2,-33.9],[172,-42],[-160,-42],[-118.2,34]]},
  {n:'EASSy',      s:'active', c:'#3fb950',pts:[[32,-1],[37,-12],[18,-34],[8,-4]]},
  {n:'SEACOM',     s:'partial',c:'#d29922',pts:[[32,-35],[40,-25],[57,23],[72.8,19]]},
  {n:'India-ME-WE',s:'active', c:'#3fb950',pts:[[72.8,19],[60,22],[43,12],[25,37]]},
];
const LP=[
  ['New York',-74,40.7],['London',0,51.5],['Marseille',4.8,36.8],['Singapore',103.8,1.3],
  ['Tokyo',139.7,35.6],['Los Angeles',-118.2,34],['Sydney',151.2,-33.9],['Mumbai',72.8,19],
  ['Cape Town',18,-34],['São Paulo',-35,-8],['Hong Kong',114,22.3],['Karachi',67,24.8],
  ['Djibouti',43,12],['Alexandria',32,30],['Portland',-122,45.5],['Mombasa',40,-4],
];
const SL={active:'Active',partial:'Partial',fault:'Fault',maint:'Maintenance'};
const tip=document.getElementById('tip');

// Cable mini table
document.getElementById('cable-mini').innerHTML=CABLES.map(c=>`
  <tr style="border-bottom:1px solid #21262d">
    <td style="padding:4px 10px;color:#58a6ff;font-size:11px">${c.n}</td>
    <td style="padding:4px 10px"><span style="font-size:10px;font-weight:700;color:${c.c}">${SL[c.s]}</span></td>
  </tr>`).join('');

// Map
(function initMap(){
  const W=960,H=400;
  const svg=d3.select('#wmap');
  const proj=d3.geoNaturalEarth1().scale(155).translate([W/2,H/2+8]);
  const path=d3.geoPath(proj);
  const lg=d3.line().x(d=>proj(d)[0]).y(d=>proj(d)[1]).curve(d3.curveCardinal.tension(.4));

  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
    svg.append('rect').attr('width',W).attr('height',H).attr('fill','#0d1117');
    svg.append('g').selectAll('path')
      .data(topojson.feature(world,world.objects.countries).features)
      .join('path').attr('d',path)
      .attr('fill','#161b22').attr('stroke','#21262d').attr('stroke-width',.5);

    CABLES.forEach(cable=>{
      const g=svg.append('g').style('cursor','pointer');
      g.append('path').datum(cable.pts).attr('d',lg).attr('fill','none')
        .attr('stroke',cable.c).attr('stroke-width',2.5).attr('stroke-opacity',.10).attr('stroke-linecap','round');
      g.append('path').datum(cable.pts).attr('d',lg).attr('fill','none')
        .attr('stroke',cable.c).attr('stroke-width',1.6).attr('stroke-opacity',.82).attr('stroke-linecap','round')
        .attr('stroke-dasharray',cable.s==='maint'?'5,3':'none');
      if(cable.s==='active'){
        g.append('path').datum(cable.pts).attr('d',lg).attr('fill','none')
          .attr('stroke','rgba(255,255,255,.45)').attr('stroke-width',.9).attr('stroke-dasharray','4 80')
          .append('animate').attr('attributeName','stroke-dashoffset')
          .attr('from','0').attr('to','-84').attr('dur','2s').attr('repeatCount','indefinite');
      }
      g.on('mouseover',function(ev){
        d3.select(this).selectAll('path').each(function(){const w=+d3.select(this).attr('stroke-width');if(w)d3.select(this).attr('stroke-width',w*1.7);});
        tip.style.display='block';
        tip.innerHTML=`<div class="tip-t">${e(cable.n)}</div>
          <div class="tip-r"><span>Status</span><span style="color:${cable.c}">${SL[cable.s]}</span></div>
          <div class="tip-r"><span>Segments</span><span>${cable.pts.length-1}</span></div>`;
        posTip(ev);
      }).on('mousemove',posTip).on('mouseout',function(){
        d3.select(this).selectAll('path').each(function(){const w=+d3.select(this).attr('stroke-width');if(w)d3.select(this).attr('stroke-width',w/1.7);});
        tip.style.display='none';
      });
    });

    LP.forEach(([nm,lon,lat])=>{
      const[x,y]=proj([lon,lat]);
      const g=svg.append('g').style('cursor','pointer');
      g.append('circle').attr('cx',x).attr('cy',y).attr('r',5).attr('fill','rgba(210,168,255,.1)').attr('stroke','#d2a8ff').attr('stroke-width',.7);
      g.append('circle').attr('cx',x).attr('cy',y).attr('r',2.5).attr('fill','#d2a8ff');
      g.on('mouseover',function(ev){
        g.select('circle:last-child').attr('r',4);
        tip.style.display='block';
        tip.innerHTML=`<div class="tip-t">📍 ${e(nm)}</div><div class="tip-r"><span>Type</span><span>Landing point</span></div>`;
        posTip(ev);
      }).on('mousemove',posTip).on('mouseout',function(){g.select('circle:last-child').attr('r',2.5);tip.style.display='none';});
    });
  });
})();

function posTip(ev){
  const wr=document.getElementById('map-wrap').getBoundingClientRect();
  let x=ev.clientX-wr.left+12,y=ev.clientY-wr.top+12;
  if(x+155>wr.width)x-=168;if(y+90>wr.height)y-=100;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

// Mesh
async function loadNodes(){
  try{
    const r=await fetch('/api/mesh/nodes').then(x=>x.json());
    const nodes=r.nodes||[];
    document.getElementById('peer-c').textContent=nodes.length+' peers';
    document.getElementById('node-list').innerHTML=nodes.map(n=>`
      <div class="node-card${n.is_self?' self':''}">
        <div class="nc-top">
          <div class="nc-dot" style="background:${n.is_self?'#58a6ff':'#3fb950'}"></div>
          <div class="nc-name">${e(n.name)}</div>
        </div>
        <div class="nc-id">${n.node_id?.slice(0,8)}</div>
        <div class="nc-ip">${n.ip}:${n.port}</div>
        ${!n.is_self?`<div class="nc-act">
          <button class="nbtn ping" onclick="pingNode('${n.ip}',${n.port})">Ping</button>
          <button class="nbtn" onclick="sendTo('${n.ip}',${n.port},'${n.node_id}')">Message</button>
        </div>`:'<div class="nc-act"><span style="font-size:10px;color:#58a6ff">This node</span></div>'}
      </div>`).join('');
  }catch{document.getElementById('node-list').innerHTML='<div style="padding:10px 12px;color:#8b949e;font-size:12px">Backend offline</div>';}
}
async function loadMsgs(){
  try{
    const r=await fetch('/api/mesh/messages?limit=20').then(x=>x.json());
    const msgs=(r.messages||[]).slice().reverse();
    document.getElementById('msg-list').innerHTML=msgs.map(m=>`
      <div class="msg-item">
        <div class="msg-from">${e(m.from_name||m.from_node)}</div>
        <div class="msg-body">${e(m.content?.slice(0,80))}</div>
        <div class="msg-time">${new Date(m.ts*1000).toLocaleTimeString()}</div>
      </div>`).join('');
    document.getElementById('msg-list').scrollTop=9999;
  }catch{}
}
async function scanNodes(){await fetch('/api/mesh/scan',{method:'POST'});setTimeout(loadNodes,2000);}
async function broadcastAll(){
  const msg=prompt('Broadcast to all nodes:'); if(!msg)return;
  await fetch('/api/mesh/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})});
  setTimeout(loadMsgs,500);
}
async function sendMsg(){
  const msg=document.getElementById('send-input').value.trim(); if(!msg)return;
  await fetch('/api/mesh/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})});
  document.getElementById('send-input').value='';
  setTimeout(loadMsgs,400);
}
async function pingNode(ip,port){
  const t=Date.now();
  try{await fetch(`http://${ip}:${port}/api/mesh/info`,{signal:AbortSignal.timeout(3000)});alert(`Ping ${ip}: ${Date.now()-t}ms`);}
  catch{alert(`Ping ${ip}: timeout`);}
}
function sendTo(ip,port,nid){
  const msg=prompt(`Message to ${ip}:`); if(!msg)return;
  fetch('/api/mesh/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,port,node_id:nid,content:msg})});
  setTimeout(loadMsgs,500);
}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadNodes(); loadMsgs();
setInterval(loadNodes,8000); setInterval(loadMsgs,4000);
</script>
<script src="/static/aria.js"></script>
</body>
</html>
